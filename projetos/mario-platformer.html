<body>
    <div id="root">
        <div id="loading-screen" style="display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(to bottom right, #60a5fa, #3b82f6, #2563eb); color: white; font-family: 'Press Start 2P', cursive; font-size: 12px;">
            <div style="text-align: center;">
                <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
                <div>Carregando jogo...</div>

    <script>
        // Hide loading screen when React is ready
        function hideLoading() {
            const loading = document.getElementById('loading-screen');
            if (loading) {
                loading.style.display = 'none';
            }
        }
        
        // Check if React is loaded
        function checkReactLoaded() {
            if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
                hideLoading();
            } else {
                setTimeout(checkReactLoaded, 50);
            }
        }
        
        // Start checking
        window.addEventListener('load', checkReactLoaded);
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const PixelHopGame = () => {
            const canvasRef = useRef(null);
            const gameLoopRef = useRef(null);
            const [gameState, setGameState] = useState('menu');
            const [score, setScore] = useState(0);
            const [highScore, setHighScore] = useState(0);
            const [lives, setLives] = useState(3);
            const [level, setLevel] = useState(1);
            const [isMobile, setIsMobile] = useState(false);
            const [canvasSize, setCanvasSize] = useState({ width: 800, height: 600 });
            
            const LEVEL_CONFIG = [
                null,
                { enemies: 4, enemyVx: -1.2, platformCount: 24, platformWidth: 200, gap: 130, heightVar: 70, levelLength: 3400, coinCount: 14 },
                { enemies: 5, enemyVx: -1.5, platformCount: 22, platformWidth: 175, gap: 155, heightVar: 90, levelLength: 3900, coinCount: 13 },
                { enemies: 6, enemyVx: -1.8, platformCount: 20, platformWidth: 160, gap: 175, heightVar: 105, levelLength: 4400, coinCount: 12 },
                { enemies: 7, enemyVx: -2.1, platformCount: 18, platformWidth: 145, gap: 190, heightVar: 115, levelLength: 5000, coinCount: 11 },
                { enemies: 8, enemyVx: -2.4, platformCount: 16, platformWidth: 120, gap: 210, heightVar: 130, levelLength: 5600, coinCount: 10 }
            ];
            
            const gameRef = useRef({
                player: { x: 100, y: 400, width: 40, height: 50, vx: 0, vy: 0, speed: 5, jumpPower: -15, onGround: false, invulnerable: 0 },
                platforms: [],
                enemies: [],
                coins: [],
                particles: [],
                keys: {},
                camera: { x: 0, y: 0 },
                level: 1,
                levelEnd: 3400,
                goal: null,
                checkpoint: { x: 100, y: 350 },
                levelMessage: null,
                levelCompleting: false,
                respawning: false
            });

            // Detect mobile and adjust canvas size
            useEffect(() => {
                const checkMobile = () => {
                    const mobile = window.innerWidth <= 768;
                    setIsMobile(mobile);
                    if (mobile) {
                        const maxWidth = window.innerWidth - 40;
                        const aspectRatio = 800 / 600;
                        const width = Math.min(maxWidth, 600);
                        const height = width / aspectRatio;
                        setCanvasSize({ width, height });
                    } else {
                        setCanvasSize({ width: 800, height: 600 });
                    }
                };
                checkMobile();
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            useEffect(() => {
                gameRef.current.player.jumpPower = isMobile ? -16 : -15;
            }, [isMobile]);

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('pixel-hop-highscore');
                    if (saved) {
                        setHighScore(parseInt(saved));
                    }
                } catch (error) {
                    // Tracking Prevention or localStorage blocked
                    console.log('High score not available:', error.message);
                }
            }, []);

            const saveHighScore = (score) => {
                try {
                    localStorage.setItem('pixel-hop-highscore', score.toString());
                } catch (error) {
                    // Tracking Prevention or localStorage blocked - silently fail
                    console.log('High score save not available:', error.message);
                }
            };

            const getJumpPower = () => (isMobile ? -16 : -15);

            const findPlatformY = (platforms, x) => {
                let bestY = 500;
                platforms.forEach(p => {
                    if (x >= p.x && x <= p.x + p.width && p.y < bestY) bestY = p.y;
                });
                return bestY;
            };

            const initLevel = () => {
                const game = gameRef.current;
                const cfg = LEVEL_CONFIG[game.level] || LEVEL_CONFIG[1];
                game.platforms = [];
                game.enemies = [];
                game.coins = [];
                game.particles = [];
                game.levelCompleting = false;
                game.respawning = false;

                let px = 0;
                for (let i = 0; i < cfg.platformCount; i++) {
                    const y = 500 - (i % 3) * (cfg.heightVar * 0.45) - Math.sin(i * 0.6) * (cfg.heightVar * 0.35);
                    game.platforms.push({
                        x: px,
                        y,
                        width: cfg.platformWidth,
                        height: 20,
                        color: i % 2 === 0 ? '#8B4513' : '#A0522D'
                    });
                    px += cfg.platformWidth + cfg.gap;
                }

                game.levelEnd = cfg.levelLength;
                const goalPlatform = game.platforms[game.platforms.length - 1];
                const goalX = Math.min(cfg.levelLength - 60, goalPlatform.x + goalPlatform.width - 50);
                const goalY = goalPlatform.y - 100;
                game.goal = { x: goalX, y: goalY, width: 40, height: 100 };

                const coinSpacing = cfg.levelLength / (cfg.coinCount + 1);
                for (let i = 0; i < cfg.coinCount; i++) {
                    const cx = coinSpacing * (i + 1);
                    const py = findPlatformY(game.platforms, cx);
                    game.coins.push({
                        x: cx,
                        y: py - 60,
                        width: 30,
                        height: 30,
                        collected: false,
                        rotation: 0
                    });
                }

                const enemySpacing = cfg.levelLength / (cfg.enemies + 1);
                for (let i = 0; i < cfg.enemies; i++) {
                    const ex = enemySpacing * (i + 1);
                    const ey = findPlatformY(game.platforms, ex) - 35;
                    game.enemies.push({
                        x: ex,
                        y: ey,
                        width: 35,
                        height: 35,
                        vx: cfg.enemyVx,
                        vy: 0,
                        direction: -1
                    });
                }

                const startY = findPlatformY(game.platforms, 100) - game.player.height;
                game.player.x = 100;
                game.player.y = startY;
                game.player.vx = 0;
                game.player.vy = 0;
                game.player.jumpPower = getJumpPower();
                game.player.invulnerable = 60;
                game.checkpoint = { x: 100, y: startY };
                game.camera.x = 0;
            };

            const respawnPlayer = () => {
                const game = gameRef.current;
                const { player, checkpoint } = game;
                player.x = checkpoint.x;
                player.y = checkpoint.y;
                player.vx = 0;
                player.vy = 0;
                player.invulnerable = 120;
            };

            const loseLife = useCallback(() => {
                const game = gameRef.current;
                if (game.respawning) return;
                game.respawning = true;
                setLives(l => {
                    const newLives = l - 1;
                    if (newLives <= 0) {
                        setGameState('gameOver');
                        setScore(s => {
                            if (s > highScore) {
                                setHighScore(s);
                                saveHighScore(s);
                            }
                            return s;
                        });
                    } else {
                        respawnPlayer();
                    }
                    setTimeout(() => { game.respawning = false; }, 400);
                    return newLives;
                });
            }, [highScore]);

            const completeLevel = useCallback(() => {
                const game = gameRef.current;
                if (game.levelCompleting) return;
                game.levelCompleting = true;
                createParticles(game.goal.x + 20, game.goal.y + 50, '#22c55e', 25);
                setScore(s => s + 500);

                if (game.level >= 5) {
                    setScore(s => {
                        if (s > highScore) {
                            setHighScore(s);
                            saveHighScore(s);
                        }
                        return s;
                    });
                    setGameState('victory');
                    return;
                }

                game.level += 1;
                setLevel(game.level);
                game.levelMessage = { text: `Fase ${game.level}`, timer: 150 };
                initLevel();
            }, [highScore]);

            const startGame = () => {
                setGameState('playing');
                setScore(0);
                setLives(3);
                setLevel(1);
                gameRef.current.level = 1;
                gameRef.current.levelMessage = null;
                gameRef.current.player.invulnerable = 0;
                initLevel();
            };

            const createParticles = (x, y, color, count = 10) => {
                const game = gameRef.current;
                for (let i = 0; i < count; i++) {
                    game.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        life: 30,
                        color,
                        size: Math.random() * 4 + 2
                    });
                }
            };

            const checkCollision = (a, b) => {
                return a.x < b.x + b.width &&
                       a.x + a.width > b.x &&
                       a.y < b.y + b.height &&
                       a.y + a.height > b.y;
            };

            const gameLoop = useCallback(() => {
                if (gameState !== 'playing') return;

                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                const game = gameRef.current;
                const { player, keys } = game;

                // Clear canvas
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw clouds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 5; i++) {
                    const x = (i * 300 + game.camera.x * 0.3) % (canvas.width + 200) - 100;
                    const y = 50 + i * 30;
                    ctx.beginPath();
                    ctx.arc(x, y, 30, 0, Math.PI * 2);
                    ctx.arc(x + 40, y, 35, 0, Math.PI * 2);
                    ctx.arc(x + 80, y, 30, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Player movement
                if (keys.ArrowLeft || keys.a || keys.A) {
                    player.vx = -player.speed;
                } else if (keys.ArrowRight || keys.d || keys.D) {
                    player.vx = player.speed;
                } else {
                    player.vx *= 0.8;
                }

                if ((keys.ArrowUp || keys.w || keys.W || keys[' ']) && player.onGround) {
                    player.vy = player.jumpPower;
                    player.onGround = false;
                }

                // Apply gravity
                player.vy += 0.8;
                if (player.vy > 15) player.vy = 15;

                // Update invulnerability timer
                if (player.invulnerable > 0) {
                    player.invulnerable--;
                }

                // Update player position
                player.x += player.vx;
                player.y += player.vy;

                // Check platform collisions
                player.onGround = false;
                game.platforms.forEach(platform => {
                    if (checkCollision(player, platform)) {
                        if (player.vy > 0 && player.y < platform.y) {
                            player.y = platform.y - player.height;
                            player.vy = 0;
                            player.onGround = true;
                            if (player.x >= game.checkpoint.x - 20) {
                                game.checkpoint = { x: player.x, y: platform.y - player.height };
                            }
                        }
                    }
                });

                // Update camera
                game.camera.x = Math.max(0, player.x - canvas.width / 3);

                // Draw platforms
                game.platforms.forEach(platform => {
                    const px = platform.x - game.camera.x;
                    if (px > -100 && px < canvas.width + 100) {
                        ctx.fillStyle = platform.color;
                        ctx.fillRect(px, platform.y - game.camera.y, platform.width, platform.height);
                        ctx.fillStyle = '#654321';
                        ctx.fillRect(px, platform.y - game.camera.y, platform.width, 5);
                    }
                });

                // Update and draw enemies
                game.enemies = game.enemies.filter(enemy => {
                    enemy.x += enemy.vx;
                    
                    // Bounce off platforms
                    let onPlatform = false;
                    game.platforms.forEach(platform => {
                        if (checkCollision(enemy, platform)) {
                            if (enemy.y < platform.y) {
                                enemy.y = platform.y - enemy.height;
                                onPlatform = true;
                            }
                        }
                    });
                    
                    if (!onPlatform) {
                        enemy.vy += 0.8;
                        enemy.y += enemy.vy;
                    } else {
                        enemy.vy = 0;
                    }
                    
                    // Despawn only when far behind camera
                    if (enemy.x + enemy.width < game.camera.x - 100) {
                        return false;
                    }
                    
                    const ex = enemy.x - game.camera.x;
                    if (ex > -50 && ex < canvas.width + 50) {
                        ctx.fillStyle = '#8B0000';
                        ctx.fillRect(ex, enemy.y - game.camera.y, enemy.width, enemy.height);
                        ctx.fillStyle = '#FF0000';
                        ctx.fillRect(ex + 5, enemy.y - game.camera.y + 5, enemy.width - 10, enemy.height - 10);
                    }
                    
                    // Check collision with player (apenas se não estiver invulnerável)
                    if (checkCollision(player, enemy) && player.invulnerable <= 0) {
                        if (player.vy > 0 && player.y < enemy.y) {
                            // Player jumps on enemy
                            createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#8B0000', 15);
                            setScore(s => s + 50);
                            return false;
                        } else {
                            createParticles(player.x + player.width / 2, player.y + player.height / 2, '#FF0000', 20);
                            loseLife();
                        }
                    }
                    
                    return true;
                });

                // Update and draw coins
                game.coins.forEach(coin => {
                    if (!coin.collected) {
                        coin.rotation += 0.1;
                        const cx = coin.x - game.camera.x;
                        const cy = coin.y - game.camera.y;
                        
                        if (cx > -50 && cx < canvas.width + 50) {
                            ctx.save();
                            ctx.translate(cx + coin.width / 2, cy + coin.height / 2);
                            ctx.rotate(coin.rotation);
                            ctx.fillStyle = '#FFD700';
                            ctx.shadowColor = '#FFD700';
                            ctx.shadowBlur = 10;
                            ctx.beginPath();
                            ctx.arc(0, 0, coin.width / 2, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#FFA500';
                            ctx.beginPath();
                            ctx.arc(0, 0, coin.width / 3, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.shadowBlur = 0;
                            ctx.restore();
                        }
                        
                        if (checkCollision(player, coin)) {
                            coin.collected = true;
                            createParticles(coin.x + coin.width / 2, coin.y + coin.height / 2, '#FFD700', 10);
                            setScore(s => s + 100);
                        }
                    }
                });

                // Update and draw particles
                game.particles = game.particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    
                    if (p.life > 0) {
                        const px = p.x - game.camera.x;
                        const py = p.y - game.camera.y;
                        if (px > -10 && px < canvas.width + 10) {
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = p.life / 30;
                            ctx.fillRect(px, py, p.size, p.size);
                            ctx.globalAlpha = 1;
                        }
                        return true;
                    }
                    return false;
                });

                // Draw player (piscar quando invulnerável)
                const px = player.x - game.camera.x;
                const py = player.y - game.camera.y;
                if (player.invulnerable <= 0 || Math.floor(player.invulnerable / 10) % 2 === 0) {
                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(px, py, player.width, player.height);
                    ctx.fillStyle = '#0000FF';
                    ctx.fillRect(px + 5, py + 5, player.width - 10, 15);
                    ctx.fillStyle = '#FFFF00';
                    ctx.fillRect(px + 10, py + 20, 20, 20);
                }

                // Draw goal flag
                if (game.goal) {
                    const gx = game.goal.x - game.camera.x;
                    const gy = game.goal.y - game.camera.y;
                    if (gx > -80 && gx < canvas.width + 80) {
                        ctx.fillStyle = '#555';
                        ctx.fillRect(gx + 18, gy, 6, game.goal.height);
                        ctx.fillStyle = '#22c55e';
                        ctx.fillRect(gx, gy + 8, 22, 18);
                        ctx.fillStyle = '#16a34a';
                        ctx.fillRect(gx, gy + 26, 22, 18);
                        ctx.fillStyle = '#FFD700';
                        ctx.beginPath();
                        ctx.arc(gx + 21, gy + 4, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    if (checkCollision(player, game.goal) || player.x + player.width >= game.levelEnd - 40) {
                        completeLevel();
                    }
                }

                // Level transition message
                if (game.levelMessage && game.levelMessage.timer > 0) {
                    game.levelMessage.timer--;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    ctx.fillRect(0, canvas.height / 2 - 40, canvas.width, 80);
                    ctx.fillStyle = '#facc15';
                    ctx.font = '20px "Press Start 2P", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(game.levelMessage.text, canvas.width / 2, canvas.height / 2 + 8);
                    ctx.textAlign = 'left';
                }

                // Check if player fell
                const playerScreenY = player.y - game.camera.y;
                if (playerScreenY > canvas.height + 100) {
                    loseLife();
                }

                gameLoopRef.current = requestAnimationFrame(gameLoop);
            }, [gameState, loseLife, completeLevel]);

            useEffect(() => {
                if (gameState === 'playing') {
                    gameLoopRef.current = requestAnimationFrame(gameLoop);
                }
                return () => {
                    if (gameLoopRef.current) {
                        cancelAnimationFrame(gameLoopRef.current);
                    }
                };
            }, [gameState, gameLoop]);

            // Touch controls handlers
            const handleTouchStart = (direction) => {
                const game = gameRef.current;
                if (direction === 'left' || direction === 'a') game.keys.ArrowLeft = true;
                if (direction === 'right' || direction === 'd') game.keys.ArrowRight = true;
                if (direction === 'jump' || direction === 'w' || direction === ' ') {
                    if (game.player.onGround) {
                        game.player.vy = game.player.jumpPower;
                        game.player.onGround = false;
                    }
                }
            };

            const handleTouchEnd = (direction) => {
                const game = gameRef.current;
                if (direction === 'left' || direction === 'a') game.keys.ArrowLeft = false;
                if (direction === 'right' || direction === 'd') game.keys.ArrowRight = false;
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'a', 'A', 'd', 'D', 'w', 'W', ' '].includes(e.key)) {
                        e.preventDefault();
                    }
                    gameRef.current.keys[e.key] = true;
                };

                const handleKeyUp = (e) => {
                    gameRef.current.keys[e.key] = false;
                };

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);

                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, [gameState]);

            return (
                <div style={{ minHeight: '100vh', background: 'linear-gradient(to bottom right, #60a5fa, #3b82f6, #2563eb)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem', fontFamily: "'Press Start 2P', cursive" }}>
                    <div className="relative">
                        {/* HUD */}
                        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', padding: '1rem', color: 'white', zIndex: 10, fontSize: '12px' }}>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                    <span style={{ color: '#facc15' }}>💰</span>
                                    <span>{score}</span>
                                </div>
                                <div style={{ display: 'flex', gap: '0.25rem' }}>
                                    {[...Array(lives)].map((_, i) => (
                                        <div key={i} style={{ width: '24px', height: '24px', backgroundColor: '#ef4444', border: '2px solid #fca5a5' }} />
                                    ))}
                                </div>
                                {gameState === 'playing' && (
                                    <div style={{ fontSize: '10px', color: '#bfdbfe' }}>Fase {level}/5</div>
                                )}
                            </div>
                            
                            <div style={{ textAlign: 'right', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                <div style={{ fontSize: '12px', color: '#d1d5db' }}>RECORDE</div>
                                <div style={{ color: '#facc15' }}>{highScore}</div>
                            </div>
                        </div>

                        <canvas
                            ref={canvasRef}
                            width={canvasSize.width}
                            height={canvasSize.height}
                            style={{ border: '4px solid #2563eb', boxShadow: '0 0 30px rgba(37, 99, 235, 0.5), 0 25px 50px -12px rgba(0, 0, 0, 0.25)', backgroundColor: '#93c5fd', maxWidth: '100%', height: 'auto' }}
                        />

                        {/* Touch Controls for Mobile */}
                        {isMobile && gameState === 'playing' && (
                            <div className="touch-controls">
                                <div className="dpad">
                                    <button 
                                        className="up"
                                        onTouchStart={(e) => { e.preventDefault(); handleTouchStart('jump'); }}
                                        onMouseDown={() => handleTouchStart('jump')}
                                    >↑</button>
                                    <button 
                                        className="left"
                                        onTouchStart={(e) => { e.preventDefault(); handleTouchStart('left'); }}
                                        onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('left'); }}
                                        onMouseDown={() => handleTouchStart('left')}
                                        onMouseUp={() => handleTouchEnd('left')}
                                        onMouseLeave={() => handleTouchEnd('left')}
                                    >←</button>
                                    <div></div>
                                    <button 
                                        className="right"
                                        onTouchStart={(e) => { e.preventDefault(); handleTouchStart('right'); }}
                                        onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('right'); }}
                                        onMouseDown={() => handleTouchStart('right')}
                                        onMouseUp={() => handleTouchEnd('right')}
                                        onMouseLeave={() => handleTouchEnd('right')}
                                    >→</button>
                                </div>
                            </div>
                        )}

                        {/* Menu Overlay */}
                        {gameState === 'menu' && (
                            <div style={{ position: 'absolute', inset: 0, backgroundColor: 'rgba(0, 0, 0, 0.9)', display: 'flex', alignItems: 'center', justifyContent: 'center', backdropFilter: 'blur(4px)' }}>
                                <div style={{ textAlign: 'center', display: 'flex', flexDirection: 'column', gap: '2rem', padding: '2rem' }}>
                                    <h1 style={{ fontSize: '3rem', background: 'linear-gradient(to right, #ef4444, #facc15, #ef4444)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text', animation: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' }}>
                                        PIXEL HOP<br/>PLATFORMER
                                    </h1>
                                    
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem', fontSize: '12px', color: '#93c5fd' }}>
                                        <p>A/D ou SETAS - Mover</p>
                                        <p>W ou SETA CIMA ou ESPAÇO - Pular</p>
                                        <p>Colete moedas e elimine inimigos!</p>
                                        <p>Complete 5 fases até a bandeira!</p>
                                    </div>

                                    <button
                                        onClick={startGame}
                                        style={{ background: 'linear-gradient(to right, #ef4444, #dc2626)', color: 'white', padding: '1rem 2rem', fontSize: '14px', border: '4px solid white', boxShadow: '0 0 20px rgba(239, 68, 68, 0.5)', cursor: 'pointer', transition: 'all 0.3s' }}
                                        onMouseEnter={(e) => { e.target.style.transform = 'scale(1.1)'; e.target.style.background = 'linear-gradient(to right, #f87171, #ef4444)'; }}
                                        onMouseLeave={(e) => { e.target.style.transform = 'scale(1)'; e.target.style.background = 'linear-gradient(to right, #ef4444, #dc2626)'; }}
                                        onMouseDown={(e) => { e.target.style.transform = 'scale(0.95)'; }}
                                        onMouseUp={(e) => { e.target.style.transform = 'scale(1.1)'; }}
                                    >
                                        INICIAR
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Victory Overlay */}
                        {gameState === 'victory' && (
                            <div style={{ position: 'absolute', inset: 0, backgroundColor: 'rgba(0, 0, 0, 0.9)', display: 'flex', alignItems: 'center', justifyContent: 'center', backdropFilter: 'blur(4px)' }}>
                                <div style={{ textAlign: 'center', display: 'flex', flexDirection: 'column', gap: '1.5rem', padding: '2rem' }}>
                                    <h2 style={{ fontSize: '2rem', color: '#22c55e', animation: 'bounce 1s infinite' }}>VITÓRIA!</h2>
                                    <p style={{ fontSize: '11px', color: '#93c5fd' }}>Você completou todas as 5 fases!</p>
                                    
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem', fontSize: '1.25rem' }}>
                                        <div>
                                            <div style={{ fontSize: '12px', color: '#9ca3af', marginBottom: '0.25rem' }}>PONTUAÇÃO FINAL</div>
                                            <div style={{ color: '#facc15' }}>{score}</div>
                                        </div>
                                        
                                        {score === highScore && score > 0 && (
                                            <div style={{ color: '#facc15', fontSize: '14px', animation: 'bounce 1s infinite' }}>
                                                🏆 NOVO RECORDE! 🏆
                                            </div>
                                        )}
                                        
                                        <div>
                                            <div style={{ fontSize: '12px', color: '#9ca3af', marginBottom: '0.25rem' }}>RECORDE</div>
                                            <div style={{ color: '#facc15' }}>{highScore}</div>
                                        </div>
                                    </div>

                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', paddingTop: '1rem' }}>
                                        <button
                                            onClick={startGame}
                                            style={{ width: '100%', background: 'linear-gradient(to right, #16a34a, #15803d)', color: 'white', padding: '0.75rem 2rem', fontSize: '12px', border: '2px solid white', cursor: 'pointer', transition: 'all 0.3s' }}
                                            onMouseEnter={(e) => { e.target.style.transform = 'scale(1.05)'; e.target.style.background = 'linear-gradient(to right, #22c55e, #16a34a)'; }}
                                            onMouseLeave={(e) => { e.target.style.transform = 'scale(1)'; e.target.style.background = 'linear-gradient(to right, #16a34a, #15803d)'; }}
                                        >
                                            JOGAR NOVAMENTE
                                        </button>
                                        <button
                                            onClick={() => setGameState('menu')}
                                            style={{ width: '100%', backgroundColor: '#b91c1c', color: 'white', padding: '0.75rem 2rem', fontSize: '12px', border: '2px solid #f87171', cursor: 'pointer', transition: 'background-color 0.3s' }}
                                            onMouseEnter={(e) => { e.target.style.backgroundColor = '#dc2626'; }}
                                            onMouseLeave={(e) => { e.target.style.backgroundColor = '#b91c1c'; }}
                                        >
                                            MENU
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Game Over Overlay */}
                        {gameState === 'gameOver' && (
                            <div style={{ position: 'absolute', inset: 0, backgroundColor: 'rgba(0, 0, 0, 0.9)', display: 'flex', alignItems: 'center', justifyContent: 'center', backdropFilter: 'blur(4px)' }}>
                                <div style={{ textAlign: 'center', display: 'flex', flexDirection: 'column', gap: '1.5rem', padding: '2rem' }}>
                                    <h2 style={{ fontSize: '2.25rem', color: '#ef4444', animation: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' }}>GAME OVER</h2>
                                    
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem', fontSize: '1.25rem' }}>
                                        <div>
                                            <div style={{ fontSize: '12px', color: '#9ca3af', marginBottom: '0.25rem' }}>PONTUAÇÃO</div>
                                            <div style={{ color: '#facc15' }}>{score}</div>
                                        </div>
                                        
                                        {score === highScore && score > 0 && (
                                            <div style={{ color: '#facc15', fontSize: '14px', animation: 'bounce 1s infinite' }}>
                                                🏆 NOVO RECORDE! 🏆
                                            </div>
                                        )}
                                        
                                        <div>
                                            <div style={{ fontSize: '12px', color: '#9ca3af', marginBottom: '0.25rem' }}>RECORDE</div>
                                            <div style={{ color: '#facc15' }}>{highScore}</div>
                                        </div>
                                    </div>

                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', paddingTop: '1rem' }}>
                                        <button
                                            onClick={startGame}
                                            style={{ width: '100%', background: 'linear-gradient(to right, #16a34a, #15803d)', color: 'white', padding: '0.75rem 2rem', fontSize: '12px', border: '2px solid white', cursor: 'pointer', transition: 'all 0.3s' }}
                                            onMouseEnter={(e) => { e.target.style.transform = 'scale(1.05)'; e.target.style.background = 'linear-gradient(to right, #22c55e, #16a34a)'; }}
                                            onMouseLeave={(e) => { e.target.style.transform = 'scale(1)'; e.target.style.background = 'linear-gradient(to right, #16a34a, #15803d)'; }}
                                        >
                                            JOGAR NOVAMENTE
                                        </button>
                                        <button
                                            onClick={() => setGameState('menu')}
                                            style={{ width: '100%', backgroundColor: '#b91c1c', color: 'white', padding: '0.75rem 2rem', fontSize: '12px', border: '2px solid #f87171', cursor: 'pointer', transition: 'background-color 0.3s' }}
                                            onMouseEnter={(e) => { e.target.style.backgroundColor = '#dc2626'; }}
                                            onMouseLeave={(e) => { e.target.style.backgroundColor = '#b91c1c'; }}
                                        >
                                            MENU
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(React.createElement(PixelHopGame), document.getElementById('root'));
        hideLoading();
    </script>
</body>
</html>
