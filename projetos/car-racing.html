<body>
    <div id="root">
        <div id="loading-screen" style="display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(to bottom right, #1f2937, #111827, #000000); color: white; font-family: 'Press Start 2P', cursive; font-size: 12px;">
            <div style="text-align: center;">
                <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>

    <script>
        // Hide loading screen when React is ready
        function hideLoading() {
            const loading = document.getElementById('loading-screen');
            if (loading) {
                loading.style.display = 'none';
            }
        }
        
        // Check if React is loaded
        function checkReactLoaded() {
            if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
                hideLoading();
            } else {
                setTimeout(checkReactLoaded, 50);
            }
        }
        
        // Start checking
        window.addEventListener('load', checkReactLoaded);
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        function roadLayout(w, h) {
            const roadX = w * 0.125;
            const roadW = w * 0.75;
            const laneXs = [0.125, 0.375, 0.625, 0.875].map(t => roadX + roadW * t);
            return {
                roadX,
                roadW,
                laneXs,
                playerY: h * 0.82,
                playerW: w * 0.07,
                playerH: h * 0.12,
                borderW: w * 0.0125,
                lineSpacing: h * (100 / 600),
                dashLen: w * 0.025,
                dashGap: w * 0.025,
                roadMargin: roadW * 0.033
            };
        }

        const DIFFICULTY = [
            null,
            { targetSpeed: 2.5, spawnChance: 0.004, minLanes: 2, maxLanes: 3 },
            { targetSpeed: 3.5, spawnChance: 0.006, minLanes: 2, maxLanes: 3 },
            { targetSpeed: 5.0, spawnChance: 0.009, minLanes: 3, maxLanes: 4 },
            { targetSpeed: 6.5, spawnChance: 0.011, minLanes: 4, maxLanes: 4 },
            { targetSpeed: 8.0, spawnChance: 0.014, minLanes: 4, maxLanes: 4 }
        ];

        function getDifficultyPhase(distance) {
            if (distance < 2000) return 1;
            if (distance < 5000) return 2;
            if (distance < 9000) return 3;
            if (distance < 15000) return 4;
            return 5;
        }

        function pickSpawnLane(laneXs, phase) {
            const cfg = DIFFICULTY[phase];
            const laneCount = cfg.minLanes + Math.floor(Math.random() * (cfg.maxLanes - cfg.minLanes + 1));
            const indices = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, laneCount);
            const laneIdx = indices[Math.floor(Math.random() * indices.length)];
            return laneXs[laneIdx];
        }

        const CarRacing = () => {
            const canvasRef = useRef(null);
            const gameLoopRef = useRef(null);
            const [gameState, setGameState] = useState('menu');
            const [score, setScore] = useState(0);
            const [highScore, setHighScore] = useState(0);
            const [speed, setSpeed] = useState(0);
            const [lives, setLives] = useState(3);
            const [phase, setPhase] = useState(1);
            const [isMobile, setIsMobile] = useState(false);
            const [canvasSize, setCanvasSize] = useState({ width: 800, height: 600 });
            
            const gameRef = useRef({
                player: { x: 0, y: 0, width: 50, height: 80, angle: 0, invulnerable: 0 },
                road: { offset: 0, lines: [] },
                obstacles: [],
                coins: [],
                particles: [],
                keys: {},
                gameSpeed: 2.5,
                lives: 3,
                distance: 0,
                runningScore: 0,
                currentPhase: 1
            });

            // Detect mobile and adjust canvas size
            useEffect(() => {
                const checkMobile = () => {
                    const mobile = window.innerWidth <= 768;
                    setIsMobile(mobile);
                    if (mobile) {
                        const width = Math.floor(window.innerWidth);
                        const height = Math.floor(width * (600 / 800));
                        setCanvasSize({ width, height });
                    } else {
                        setCanvasSize({ width: 800, height: 600 });
                    }
                };
                checkMobile();
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('car-racing-highscore');
                    if (saved) {
                        setHighScore(parseInt(saved));
                    }
                } catch (error) {
                    console.log('No high score found');
                }
            }, []);

            const saveHighScore = (score) => {
                try {
                    localStorage.setItem('car-racing-highscore', score.toString());
                } catch (error) {
                    // Tracking Prevention or localStorage blocked - silently fail
                    console.log('High score save not available:', error.message);
                }
            };

            const startGame = () => {
                setGameState('playing');
                setScore(0);
                setSpeed(0);
                setLives(3);
                setPhase(1);

                const w = canvasSize.width;
                const h = canvasSize.height;
                const layout = roadLayout(w, h);
                const game = gameRef.current;
                game.player = {
                    x: layout.roadX + layout.roadW / 2 - layout.playerW / 2,
                    y: layout.playerY,
                    width: layout.playerW,
                    height: layout.playerH,
                    angle: 0,
                    invulnerable: 0
                };
                game.road = { offset: 0, lines: [] };
                game.obstacles = [];
                game.coins = [];
                game.particles = [];
                game.gameSpeed = DIFFICULTY[1].targetSpeed;
                game.lives = 3;
                game.distance = 0;
                game.runningScore = 0;
                game.currentPhase = 1;

                for (let i = 0; i < 20; i++) {
                    game.road.lines.push(i * layout.lineSpacing);
                }
            };

            const createParticles = (x, y, color, count = 15, scale = 1) => {
                const game = gameRef.current;
                for (let i = 0; i < count; i++) {
                    game.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 10 * scale,
                        vy: (Math.random() - 0.5) * 10 * scale,
                        life: 40,
                        color,
                        size: (Math.random() * 5 + 3) * scale
                    });
                }
            };

            const spawnObstacle = (layout, currentPhase) => {
                const game = gameRef.current;
                const laneCenter = pickSpawnLane(layout.laneXs, currentPhase);
                const obsW = layout.roadW * 0.1;
                const obsH = layout.playerH * 1.25;

                game.obstacles.push({
                    x: laneCenter - obsW / 2,
                    y: -obsH,
                    width: obsW,
                    height: obsH,
                    type: Math.random() > 0.7 ? 'truck' : 'car',
                    color: `hsl(${Math.random() * 360}, 70%, 50%)`
                });
            };

            const spawnCoin = (layout, currentPhase) => {
                const game = gameRef.current;
                const laneCenter = pickSpawnLane(layout.laneXs, currentPhase);
                const coinSize = layout.roadW * 0.067;

                game.coins.push({
                    x: laneCenter - coinSize / 2,
                    y: -coinSize,
                    width: coinSize,
                    height: coinSize,
                    rotation: 0,
                    collected: false
                });
            };

            const checkCollision = (a, b) => {
                return a.x < b.x + b.width &&
                       a.x + a.width > b.x &&
                       a.y < b.y + b.height &&
                       a.y + a.height > b.y;
            };

            const gameLoop = useCallback(() => {
                if (gameState !== 'playing') return;

                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                const game = gameRef.current;
                const { player, keys } = game;
                const w = canvas.width;
                const h = canvas.height;
                const layout = roadLayout(w, h);
                const scale = w / 800;

                player.width = layout.playerW;
                player.height = layout.playerH;
                player.y = layout.playerY;

                if (player.invulnerable > 0) {
                    player.invulnerable--;
                }

                game.distance++;
                const currentPhase = getDifficultyPhase(game.distance);
                game.currentPhase = currentPhase;
                if (currentPhase !== phase) setPhase(currentPhase);

                const phaseCfg = DIFFICULTY[currentPhase];
                const targetSpeed = phaseCfg.targetSpeed;
                if (game.gameSpeed < targetSpeed) {
                    game.gameSpeed = Math.min(targetSpeed, game.gameSpeed + 0.003);
                } else if (game.gameSpeed > targetSpeed) {
                    game.gameSpeed = Math.max(targetSpeed, game.gameSpeed - 0.01);
                }
                setSpeed(Math.floor(game.gameSpeed * 10));

                game.runningScore++;
                setScore(game.runningScore);

                ctx.fillStyle = '#2d5016';
                ctx.fillRect(0, 0, w, h);

                ctx.fillStyle = '#404040';
                ctx.fillRect(layout.roadX, 0, layout.roadW, h);

                ctx.strokeStyle = '#FFFF00';
                ctx.lineWidth = Math.max(2, w * 0.005);
                ctx.setLineDash([layout.dashLen, layout.dashGap]);

                game.road.offset += game.gameSpeed;
                if (game.road.offset > layout.lineSpacing) game.road.offset = 0;

                const dividerXs = [0.25, 0.5, 0.75].map(t => layout.roadX + layout.roadW * t);
                for (let i = -2; i < 20; i++) {
                    const y = i * layout.lineSpacing - game.road.offset;
                    const dashH = layout.lineSpacing * 0.5;
                    dividerXs.forEach(dx => {
                        ctx.beginPath();
                        ctx.moveTo(dx, y);
                        ctx.lineTo(dx, y + dashH);
                        ctx.stroke();
                    });
                }
                ctx.setLineDash([]);

                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(layout.roadX - layout.borderW, 0, layout.borderW, h);
                ctx.fillRect(layout.roadX + layout.roadW, 0, layout.borderW, h);

                const moveSpeed = w * 0.0075;
                if (keys.ArrowLeft || keys.a || keys.A) {
                    player.x -= moveSpeed;
                    player.angle = -0.2;
                } else if (keys.ArrowRight || keys.d || keys.D) {
                    player.x += moveSpeed;
                    player.angle = 0.2;
                } else {
                    player.angle *= 0.8;
                }

                const minX = layout.roadX + layout.roadMargin;
                const maxX = layout.roadX + layout.roadW - player.width - layout.roadMargin;
                if (player.x < minX) player.x = minX;
                if (player.x > maxX) player.x = maxX;

                if (Math.random() < phaseCfg.spawnChance) {
                    spawnObstacle(layout, currentPhase);
                }

                if (Math.random() < phaseCfg.spawnChance * 0.75) {
                    spawnCoin(layout, currentPhase);
                }

                const pad = layout.lineSpacing;
                const detail = Math.max(3, 5 * scale);
                const wheelW = Math.max(6, 10 * scale);
                const wheelH = Math.max(10, 15 * scale);

                game.obstacles = game.obstacles.filter(obstacle => {
                    obstacle.y += game.gameSpeed;

                    const ox = obstacle.x;
                    const oy = obstacle.y;

                    ctx.save();
                    ctx.translate(ox + obstacle.width / 2, oy + obstacle.height / 2);
                    ctx.fillStyle = obstacle.color;
                    ctx.fillRect(-obstacle.width / 2, -obstacle.height / 2, obstacle.width, obstacle.height);

                    ctx.fillStyle = '#87CEEB';
                    if (obstacle.type === 'truck') {
                        ctx.fillRect(-obstacle.width / 2 + detail, -obstacle.height / 2 + detail, obstacle.width - detail * 2, obstacle.height * 0.3);
                    } else {
                        ctx.fillRect(-obstacle.width / 2 + detail, -obstacle.height / 2 + detail, obstacle.width - detail * 2, obstacle.height * 0.2);
                    }

                    ctx.fillStyle = '#000000';
                    ctx.fillRect(-obstacle.width / 2 - detail, obstacle.height / 2 - wheelH, wheelW, wheelH);
                    ctx.fillRect(obstacle.width / 2 - detail, obstacle.height / 2 - wheelH, wheelW, wheelH);
                    ctx.restore();

                    if (checkCollision(player, obstacle) && player.invulnerable <= 0) {
                        player.invulnerable = 90;
                        game.lives--;
                        setLives(game.lives);
                        createParticles(player.x + player.width / 2, player.y + player.height / 2, '#FF0000', 30, scale);
                        if (game.lives <= 0) {
                            if (game.runningScore > highScore) {
                                setHighScore(game.runningScore);
                                saveHighScore(game.runningScore);
                            }
                            setGameState('gameOver');
                        }
                        return false;
                    }

                    return obstacle.y < h + pad;
                });

                game.coins.forEach(coin => {
                    if (!coin.collected) {
                        coin.y += game.gameSpeed;
                        coin.rotation += 0.15;

                        const cx = coin.x;
                        const cy = coin.y;

                        ctx.save();
                        ctx.translate(cx + coin.width / 2, cy + coin.height / 2);
                        ctx.rotate(coin.rotation);
                        ctx.fillStyle = '#FFD700';
                        ctx.shadowColor = '#FFD700';
                        ctx.shadowBlur = 15 * scale;
                        ctx.beginPath();
                        ctx.arc(0, 0, coin.width / 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#FFA500';
                        ctx.beginPath();
                        ctx.arc(0, 0, coin.width / 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.restore();

                        if (checkCollision(player, coin)) {
                            coin.collected = true;
                            createParticles(coin.x + coin.width / 2, coin.y + coin.height / 2, '#FFD700', 15, scale);
                            game.runningScore += 500;
                            setScore(game.runningScore);
                        }
                    }
                });

                game.particles = game.particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;

                    if (p.life > 0) {
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.life / 40;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                        ctx.globalAlpha = 1;
                        return true;
                    }
                    return false;
                });

                ctx.save();
                ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
                ctx.rotate(player.angle);

                if (player.invulnerable <= 0 || Math.floor(player.invulnerable / 10) % 2 === 0) {
                    const winH = player.height * 0.31;
                    const stripeH = Math.max(3, 5 * scale);
                    const wheelOuter = Math.max(8, 12 * scale);
                    const wheelInner = Math.max(6, 8 * scale);

                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);

                    ctx.fillStyle = '#87CEEB';
                    ctx.fillRect(-player.width / 2 + detail, -player.height / 2 + detail, player.width - detail * 2, winH);

                    ctx.fillStyle = '#000000';
                    ctx.fillRect(-player.width / 2, -player.height / 2, player.width, stripeH);
                    ctx.fillRect(-player.width / 2, player.height / 2 - stripeH, player.width, stripeH);

                    ctx.fillRect(-player.width / 2 - wheelInner, player.height / 2 - wheelOuter, wheelOuter, wheelOuter);
                    ctx.fillRect(player.width / 2 - wheelInner, player.height / 2 - wheelOuter, wheelOuter, wheelOuter);
                    ctx.fillRect(-player.width / 2 - wheelInner, -player.height / 2, wheelOuter, wheelOuter);
                    ctx.fillRect(player.width / 2 - wheelInner, -player.height / 2, wheelOuter, wheelOuter);
                }

                ctx.restore();

                gameLoopRef.current = requestAnimationFrame(gameLoop);
            }, [gameState, highScore, phase]);

            useEffect(() => {
                if (gameState === 'playing') {
                    gameLoopRef.current = requestAnimationFrame(gameLoop);
                }
                return () => {
                    if (gameLoopRef.current) {
                        cancelAnimationFrame(gameLoopRef.current);
                    }
                };
            }, [gameState, gameLoop]);

            // Touch controls handlers
            const handleTouchStart = (direction) => {
                const game = gameRef.current;
                if (direction === 'left' || direction === 'a') game.keys.ArrowLeft = true;
                if (direction === 'right' || direction === 'd') game.keys.ArrowRight = true;
            };

            const handleTouchEnd = (direction) => {
                const game = gameRef.current;
                if (direction === 'left' || direction === 'a') game.keys.ArrowLeft = false;
                if (direction === 'right' || direction === 'd') game.keys.ArrowRight = false;
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (['ArrowLeft', 'ArrowRight', 'a', 'A', 'd', 'D'].includes(e.key)) {
                        e.preventDefault();
                    }
                    gameRef.current.keys[e.key] = true;
                };

                const handleKeyUp = (e) => {
                    gameRef.current.keys[e.key] = false;
                };

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);

                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, [gameState]);

            return (
                <div style={{ minHeight: '100vh', background: 'linear-gradient(to bottom right, #1f2937, #111827, #000000)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem', fontFamily: "'Press Start 2P', cursive" }}>
                    <div style={{ position: 'relative' }}>
                        {/* HUD */}
                        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', padding: '1rem', color: 'white', zIndex: 10, fontSize: isMobile ? '10px' : '12px' }}>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                    <span style={{ color: '#facc15' }}>💰</span>
                                    <span>{score}</span>
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                    <span style={{ color: '#22d3ee' }}>⚡</span>
                                    <span>{speed} km/h</span>
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                    <span style={{ color: '#ef4444' }}>❤️</span>
                                    <span>{'❤️'.repeat(Math.max(0, lives)) || '💀'}</span>
                                </div>
                            </div>

                            <div style={{ textAlign: 'center', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                <div style={{ fontSize: isMobile ? '9px' : '11px', color: '#a78bfa' }}>Fase {phase}/5</div>
                            </div>
                            
                            <div style={{ textAlign: 'right', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                <div style={{ fontSize: isMobile ? '9px' : '12px', color: '#d1d5db' }}>RECORDE</div>
                                <div style={{ color: '#facc15' }}>{highScore}</div>
                            </div>
                        </div>

                        <canvas
                            ref={canvasRef}
                            width={canvasSize.width}
                            height={canvasSize.height}
                            style={{ border: '4px solid #4b5563', boxShadow: '0 0 30px rgba(0, 0, 0, 0.5), 0 25px 50px -12px rgba(0, 0, 0, 0.25)', backgroundColor: '#1f2937', maxWidth: '100%', height: 'auto' }}
                        />

                        {/* Touch Controls for Mobile */}
                        {isMobile && gameState === 'playing' && (
                            <div className="touch-controls">
                                <div className="dpad">
                                    <button 
                                        className="left"
                                        onTouchStart={(e) => { e.preventDefault(); handleTouchStart('left'); }}
                                        onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('left'); }}
                                        onMouseDown={() => handleTouchStart('left')}
                                        onMouseUp={() => handleTouchEnd('left')}
                                        onMouseLeave={() => handleTouchEnd('left')}
                                    >←</button>
                                    <button 
                                        className="right"
                                        onTouchStart={(e) => { e.preventDefault(); handleTouchStart('right'); }}
                                        onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('right'); }}
                                        onMouseDown={() => handleTouchStart('right')}
                                        onMouseUp={() => handleTouchEnd('right')}
                                        onMouseLeave={() => handleTouchEnd('right')}
                                    >→</button>
                                </div>
                            </div>
                        )}

                        {/* Menu Overlay */}
                        {gameState === 'menu' && (
                            <div style={{ position: 'absolute', inset: 0, backgroundColor: 'rgba(0, 0, 0, 0.9)', display: 'flex', alignItems: 'center', justifyContent: 'center', backdropFilter: 'blur(4px)' }}>
                                <div style={{ textAlign: 'center', display: 'flex', flexDirection: 'column', gap: '2rem', padding: '2rem' }}>
                                    <h1 style={{ fontSize: '3rem', background: 'linear-gradient(to right, #ef4444, #facc15, #ef4444)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text', animation: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' }}>
                                        CAR<br/>RACING
                                    </h1>
                                    
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem', fontSize: '12px', color: '#67e8f9' }}>
                                        <p>A/D ou SETAS - Mover</p>
                                        <p>Evite os obstáculos!</p>
                                        <p>Colete moedas para pontos extras!</p>
                                        <p>3 vidas — 5 fases de dificuldade!</p>
                                    </div>

                                    <button
                                        onClick={startGame}
                                        style={{ background: 'linear-gradient(to right, #ef4444, #dc2626)', color: 'white', padding: '1rem 2rem', fontSize: '14px', border: '4px solid white', boxShadow: '0 0 20px rgba(239, 68, 68, 0.5)', cursor: 'pointer', transition: 'all 0.3s' }}
                                        onMouseEnter={(e) => { e.target.style.transform = 'scale(1.1)'; e.target.style.background = 'linear-gradient(to right, #f87171, #ef4444)'; }}
                                        onMouseLeave={(e) => { e.target.style.transform = 'scale(1)'; e.target.style.background = 'linear-gradient(to right, #ef4444, #dc2626)'; }}
                                        onMouseDown={(e) => { e.target.style.transform = 'scale(0.95)'; }}
                                        onMouseUp={(e) => { e.target.style.transform = 'scale(1.1)'; }}
                                    >
                                        INICIAR
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Game Over Overlay */}
                        {gameState === 'gameOver' && (
                            <div style={{ position: 'absolute', inset: 0, backgroundColor: 'rgba(0, 0, 0, 0.9)', display: 'flex', alignItems: 'center', justifyContent: 'center', backdropFilter: 'blur(4px)' }}>
                                <div style={{ textAlign: 'center', display: 'flex', flexDirection: 'column', gap: '1.5rem', padding: '2rem' }}>
                                    <h2 style={{ fontSize: '2.25rem', color: '#ef4444', animation: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' }}>GAME OVER</h2>
                                    
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem', fontSize: '1.25rem' }}>
                                        <div>
                                            <div style={{ fontSize: '12px', color: '#9ca3af', marginBottom: '0.25rem' }}>PONTUAÇÃO</div>
                                            <div style={{ color: '#facc15' }}>{score}</div>
                                        </div>
                                        
                                        {score === highScore && score > 0 && (
                                            <div style={{ color: '#facc15', fontSize: '14px', animation: 'bounce 1s infinite' }}>
                                                🏆 NOVO RECORDE! 🏆
                                            </div>
                                        )}
                                        
                                        <div>
                                            <div style={{ fontSize: '12px', color: '#9ca3af', marginBottom: '0.25rem' }}>RECORDE</div>
                                            <div style={{ color: '#facc15' }}>{highScore}</div>
                                        </div>
                                    </div>

                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', paddingTop: '1rem' }}>
                                        <button
                                            onClick={startGame}
                                            style={{ width: '100%', background: 'linear-gradient(to right, #16a34a, #15803d)', color: 'white', padding: '0.75rem 2rem', fontSize: '12px', border: '2px solid white', cursor: 'pointer', transition: 'all 0.3s' }}
                                            onMouseEnter={(e) => { e.target.style.transform = 'scale(1.05)'; e.target.style.background = 'linear-gradient(to right, #22c55e, #16a34a)'; }}
                                            onMouseLeave={(e) => { e.target.style.transform = 'scale(1)'; e.target.style.background = 'linear-gradient(to right, #16a34a, #15803d)'; }}
                                        >
                                            JOGAR NOVAMENTE
                                        </button>
                                        <button
                                            onClick={() => setGameState('menu')}
                                            style={{ width: '100%', backgroundColor: '#b91c1c', color: 'white', padding: '0.75rem 2rem', fontSize: '12px', border: '2px solid #f87171', cursor: 'pointer', transition: 'background-color 0.3s' }}
                                            onMouseEnter={(e) => { e.target.style.backgroundColor = '#dc2626'; }}
                                            onMouseLeave={(e) => { e.target.style.backgroundColor = '#b91c1c'; }}
                                        >
                                            MENU
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(React.createElement(CarRacing), document.getElementById('root'));
        hideLoading();
    </script>
</body>
</html>
